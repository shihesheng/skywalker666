    .journey{background:#f0ebe1!important}.journey-head{display:grid;grid-template-columns:1fr 1fr;gap:8%;margin-bottom:64px}.journey-head .body{align-self:end}.event{display:grid;grid-template-columns:.72fr 1.28fr;gap:8%;align-items:center;min-height:320px;padding:44px 0;border-top:1px solid rgba(32,32,29,.15)}.event:nth-child(even){grid-template-columns:1.25fr .75fr}.event:nth-child(even) .event-copy{order:2}.event h3{font:400 clamp(30px,4vw,52px)/.95 Georgia,"Songti SC",serif;letter-spacing:-.05em;margin:20px 0 5px}.event-en{font:italic 12px Georgia;color:var(--accent);margin-bottom:16px}.photos{display:grid;grid-template-columns:1.3fr .8fr;gap:var(--collage-gap);align-items:end}.photos .image:nth-child(1){min-height:205px}.photos .image:nth-child(2){min-height:145px;transform:rotate(2deg)}.event:nth-child(3n) .photos{grid-template-columns:.8fr 1.2fr}.event:nth-child(4) .photos .image:first-child{transform:rotate(-2deg)}

    .comment-mode [data-fd-id]{cursor:crosshair}.comment-mode [data-fd-id]:hover{outline:2px solid #cf8d66;outline-offset:2px}.comment-pin{position:fixed;z-index:40;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#dc744b;color:white;font-weight:700;box-shadow:0 3px 15px #0008}.popover{display:none;position:fixed;z-index:50;width:300px;padding:12px;background:#25241f;border:1px solid #706c61;box-shadow:0 18px 50px #0008}.popover.open{display:block}.popover strong{font-size:11px}.popover textarea{width:100%;height:85px;margin:8px 0;background:#171714;border:1px solid #4c4a43;color:#fff;padding:8px;resize:vertical}.popover-footer{display:flex;justify-content:space-between;align-items:center}.popover select{background:#171714;color:#fff;border:1px solid #4c4a43;padding:5px}.modal{display:none;position:fixed;inset:0;z-index:80;background:#000a;padding:5vw}.modal.open{display:grid;place-items:center}.modal-box{width:min(840px,100%);max-height:86vh;background:#22221e;border:1px solid #555249;display:flex;flex-direction:column}.modal-head{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #45433c}.modal pre{white-space:pre-wrap;overflow:auto;margin:0;padding:18px;color:#ddd8ce;font:12px/1.6 Consolas,monospace}.toast{position:fixed;right:18px;bottom:18px;z-index:100;opacity:0;transform:translateY(8px);transition:.2s;background:#f3eee4;color:#222;padding:9px 12px;border-radius:4px}.toast.show{opacity:1;transform:none}
    .compact .event{min-height:240px;padding:28px 0}.airy .event{min-height:390px;padding:70px 0}.no-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}

<body>
<div class="app">
  <header class="app-head"><div class="brand"><h1>Election story · design review</h1><p>真实页面结构的可调预览 · 双击文字可直接修改</p></div><div class="actions"><button class="btn" id="commentBtn">Comment mode</button><button class="btn" id="resetBtn">Reset</button><button class="btn primary" id="exportBtn">Export markdown</button></div></header>
  <div class="layout">
    <aside class="rail">
      <p class="help">这些控件对应 <b>src/styles/globals.css</b> 的真实视觉决策。改动会同步到两个预览；导出后可直接交给 Codex 应用。</p>
      <div class="control"><h2>Paper</h2><label>--bg / --bg-secondary</label><div class="swatches" id="paperOptions"><button class="swatch active" data-value="warm" style="background:#f5f1e8" title="当前暖纸"></button><button class="swatch" data-value="cream" style="background:#efe8da" title="更深奶油"></button><button class="swatch" data-value="pale" style="background:#f8f5ee" title="更浅纸白"></button></div></div>
      <div class="control"><h2>Accent</h2><label>--accent-orange</label><div class="swatches" id="accentOptions"><button class="swatch active" data-value="orange" style="background:#ca865e"></button><button class="swatch" data-value="rose" style="background:#a77a72"></button><button class="swatch" data-value="ochre" style="background:#b28a4f"></button></div></div>
      <div class="control"><h2>Typography</h2><label>Display scale <span class="readout" id="displayReadout">1.00×</span></label><input id="displayScale" type="range" min="0.86" max="1.14" value="1" step="0.01"></div>
      <div class="control"><h2>Spacing</h2><label>Page gutter <span class="readout" id="gutterReadout">6%</span></label><input id="gutter" type="range" min="3" max="10" value="6" step="1"></div>
      <div class="control"><h2>Story rhythm</h2><label>Journey density</label><div class="segments" id="densityOptions"><button class="segment" data-value="compact">Compact</button><button class="segment active" data-value="current">Current</button><button class="segment" data-value="airy">Airy</button></div></div>
      <div class="control"><div class="toggle-row"><div><h2 style="margin-bottom:3px">Motion</h2><label style="margin:0">Review transitions</label></div><button class="switch on" id="motionToggle" aria-label="toggle motion"></button></div></div>
      <div class="control"><h2>Comments</h2><p class="help" id="commentSummary">No comments yet.</p></div>
    </aside>
    <main class="workspace"><div class="preview-grid" id="previewGrid"></div></main>
  </div>
</div>

<template id="siteTemplate">
  <div class="site">
    <section class="hero" data-fd-id="hero"><span class="kicker">01 / WHO I AM</span><span class="hero-line"></span><p class="hero-role editable" data-fd-id="hero-role" data-fd-editable="text">外联部副部竞选</p><h1 class="display editable" data-fd-id="hero-name" data-fd-editable="text">[NAME]</h1><p class="hero-copy editable" data-fd-id="hero-kicker" data-fd-editable="text">A personal story, told through the moments that shaped it.</p><div class="image" data-fd-id="hero-image">PROFILE / MAIN<small>/images/profile-main.jpg</small></div><span class="hand hero-note">start here</span></section>
    <section class="about" data-fd-id="about"><div><span class="kicker">01 / WHO I AM</span><h2 class="display editable" data-fd-id="about-title" data-fd-editable="text">先从我开始</h2><p class="hand">A little about me.</p><p class="body editable" data-fd-id="about-body" data-fd-editable="text">[在这里写一段关于自己的话。可以是性格、加入社团的原因，或者希望大家先记住的一件小事。]</p></div><div class="about-collage" data-fd-id="about-collage"><div class="image">PROFILE / 01</div><div class="image">PROFILE / 02</div><span class="hand">keep it honest</span></div></section>
    <section class="journey" data-fd-id="journey"><header class="journey-head"><div><span class="kicker">02 / MY JOURNEY</span><h2 class="display editable" data-fd-id="journey-title" data-fd-editable="text">我与外联</h2><p class="hand">Somewhere between every event, I found my place here.</p></div><p class="body">比起把它们写成一条条经历，我更愿意把这些活动理解成我和外联共同经历过的一些瞬间。</p></header>
      <div class="events"></div>
    </section>
    <section class="meaning" data-fd-id="meaning"><header class="meaning-head"><div><span class="kicker">03 / WHAT IT MEANS</span><h2 class="display editable" data-fd-id="meaning-title" data-fd-editable="text">我理解的外联</h2><p class="hand">Not just reaching out.</p></div><p class="body">它当然包括沟通、合作和资源，但我觉得真正重要的，是把人、资源和一场活动需要解决的问题连接起来。</p></header><div class="meaning-grid"></div></section>
    <section class="plans" data-fd-id="future"><header class="plans-head"><div><span class="kicker">04 / WHAT'S NEXT</span><h2 class="display editable" data-fd-id="future-title" data-fd-editable="text">如果我成为副部</h2><p class="hand">What I want to build next.</p></div><p class="body">把已经做得好的东西继续做好，同时让外联的一些工作变得更清楚、更容易接手，也更容易积累。</p></header><div class="plans-list"></div></section>
    <section class="transition" data-fd-id="responsibility"><h2 class="editable" data-fd-id="transition-line-1" data-fd-editable="text">Not a bigger title.</h2><h2 class="editable" data-fd-id="transition-line-2" data-fd-editable="text">A bigger responsibility.</h2><p>竞选副部不是换一个 title，而是希望自己可以承担更多，让下一届外联比现在再往前一点。</p></section>
    <section class="outro" data-fd-id="outro"><span class="kicker">05 / THANK YOU</span><h2 class="editable" data-fd-id="outro-title" data-fd-editable="text">谢谢大家。</h2><p class="hand">Thanks for scrolling this far.</p><small>[NAME] · EXTERNAL RELATIONS</small></section>
  </div>
</template>

<div class="popover" id="popover"><strong id="popTarget"></strong><textarea id="popText" placeholder="写下希望如何修改这个元素…"></textarea><div class="popover-footer"><select id="popScope"><option value="this">this</option><option value="all-matching">all-matching</option><option value="global">global</option></select><div><button class="btn" id="popCancel">Cancel</button> <button class="btn primary" id="popSave">Save</button></div></div></div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><strong>Frontend design round-trip</strong><div><button class="btn" id="copyBtn">Copy</button> <button class="btn" id="closeModal">Close</button></div></div><pre id="exportText"></pre></div></div><div class="toast" id="toast"></div>

<script>
const META={source:'.frontend-design/election-story/2026-09-22-election-story.html',topic:'election-story',target:'src/styles/globals.css'};
const EVENTS=[['01','端午节','Dragon Boat Festival','第一次真正走进外联的活动现场，也是在这里开始理解一场活动背后的细节。'],['02','全员加速中','Run together.','现场节奏很快，每个人都需要知道自己什么时候出现、什么时候补位。'],['03','期末加油包','A small thing, at the right time.','活动的价值不一定取决于规模，而在于它有没有回应大家当下真正需要的东西。'],['04','Launch Week','Communication in motion.','现场体验、信息传达和整体氛围其实是连在一起的。'],['05','Welcome Party','People make the event.','一个好的活动，是创造一个让人愿意留下来的环境。'],['06','紫金宣讲','From campus to outside.','理解双方需求，让一次合作真正对彼此有价值。']];
const MEANINGS=[['01','沟通','Listen first. Then connect.'],['02','连接','The right connection matters more than more connections.'],['03','落地','Ideas only matter when they land.'],['04','责任','Make the team better, not just myself busier.']];
const PLANS=[['01','让经验留下来',"Don't start from zero every time.",['合作方信息','沟通记录','活动复盘']],['02','让新人更快进入状态','We know what to do.',['How do I contact them?','What happens next?']],['03','让合作更长期','Good relationships compound.',['one event','follow up','long-term']],['04','让外联更有参与感','Lead when needed. Step back when possible.',['try','support','share']]];
const defaults={paper:'warm',accent:'orange',display:'1',gutter:'6',density:'current',motion:true};let state={...defaults},comments=[],edits=new Map(),commentTarget=null;
function siteMarkup(){const f=document.getElementById('siteTemplate').content.cloneNode(true);const events=f.querySelector('.events');EVENTS.forEach(e=>{events.insertAdjacentHTML('beforeend',`<article class="event" data-fd-id="event-${e[0]}"><div class="event-copy"><span class="kicker">EVENT ${e[0]}</span><h3 class="editable" data-fd-id="event-title-${e[0]}" data-fd-editable="text">${e[1]}</h3><p class="event-en">${e[2]}</p><p class="body">${e[3]}</p></div><div class="photos"><div class="image">IMAGE ${e[0]}A</div><div class="image">IMAGE ${e[0]}B</div></div></article>`)});const meanings=f.querySelector('.meaning-grid');MEANINGS.forEach(m=>meanings.insertAdjacentHTML('beforeend',`<article class="meaning-card" data-fd-id="meaning-${m[0]}"><strong>${m[0]}</strong><h3>${m[1]}</h3><p>把人、资源和活动需要解决的问题连接起来。</p><blockquote>${m[2]}</blockquote></article>`));const plans=f.querySelector('.plans-list');PLANS.forEach(p=>plans.insertAdjacentHTML('beforeend',`<article class="plan" data-fd-id="plan-${p[0]}"><span class="plan-no">${p[0]}</span><div><span class="kicker">PLAN ${p[0]}</span><h3>${p[1]}</h3><p class="body">让工作更清楚、更容易接手，也更容易积累。</p><blockquote>${p[2]}</blockquote></div><div class="notes">${p[3].map(n=>`<span>${n}</span>`).join('')}</div></article>`));return f}
function render(){const grid=document.getElementById('previewGrid');grid.innerHTML='';[['Current paper','current'],['Warm ink study','study']].forEach(([label,cls])=>{const pane=document.createElement('article');pane.className='pane '+cls;pane.innerHTML=`<div class="pane-label">${label}</div>`;pane.append(siteMarkup());grid.append(pane)});bindEditable();apply()}
function apply(){const papers={warm:['#f5f1e8','#ebe4d8'],cream:['#efe8da','#e2d8c8'],pale:['#f8f5ee','#eee9df']};const accents={orange:'#ca865e',rose:'#a77a72',ochre:'#b28a4f'};document.querySelectorAll('.site').forEach(s=>{s.style.setProperty('--paper',papers[state.paper][0]);s.style.setProperty('--paper-2',papers[state.paper][1]);s.style.setProperty('--accent',accents[state.accent]);s.style.setProperty('--display-scale',state.display);s.style.setProperty('--gutter',state.gutter+'%');s.classList.toggle('compact',state.density==='compact');s.classList.toggle('airy',state.density==='airy');s.classList.toggle('no-motion',!state.motion)});document.querySelectorAll('[data-value]').forEach(b=>b.classList.toggle('active',state.paper===b.dataset.value||state.accent===b.dataset.value||state.density===b.dataset.value));document.getElementById('displayReadout').textContent=Number(state.display).toFixed(2)+'×';document.getElementById('gutterReadout').textContent=state.gutter+'%';document.getElementById('motionToggle').classList.toggle('on',state.motion)}
function bindEditable(){document.querySelectorAll('[data-fd-editable]').forEach(el=>{el.contentEditable='true';el.spellcheck=false;el.addEventListener('input',()=>{const id=el.dataset.fdId,value=el.textContent;document.querySelectorAll(`[data-fd-id="${id}"]`).forEach(peer=>{if(peer!==el)peer.textContent=value});edits.set(id,value)})})}
document.querySelectorAll('#paperOptions button').forEach(b=>b.onclick=()=>{state.paper=b.dataset.value;apply()});document.querySelectorAll('#accentOptions button').forEach(b=>b.onclick=()=>{state.accent=b.dataset.value;apply()});document.querySelectorAll('#densityOptions button').forEach(b=>b.onclick=()=>{state.density=b.dataset.value;apply()});document.getElementById('displayScale').oninput=e=>{state.display=e.target.value;apply()};document.getElementById('gutter').oninput=e=>{state.gutter=e.target.value;apply()};document.getElementById('motionToggle').onclick=()=>{state.motion=!state.motion;apply()};
const pop=document.getElementById('popover');document.getElementById('commentBtn').onclick=e=>{e.currentTarget.classList.toggle('on');document.body.classList.toggle('comment-mode');e.currentTarget.textContent=document.body.classList.contains('comment-mode')?'Exit comment mode':'Comment mode'};
document.addEventListener('click',e=>{if(!document.body.classList.contains('comment-mode')||e.target.closest('.app-head,.rail,.popover,.modal'))return;const target=e.target.closest('[data-fd-id]');if(!target)return;e.preventDefault();e.stopPropagation();commentTarget=target;document.getElementById('popTarget').textContent='[data-fd-id="'+target.dataset.fdId+'"]';document.getElementById('popText').value='';pop.style.left=Math.min(e.clientX,innerWidth-320)+'px';pop.style.top=Math.min(e.clientY+10,innerHeight-190)+'px';pop.classList.add('open')},true);
document.getElementById('popCancel').onclick=()=>pop.classList.remove('open');document.getElementById('popSave').onclick=()=>{const text=document.getElementById('popText').value.trim();if(!text)return toast('Comment is empty');comments.push({id:commentTarget.dataset.fdId,scope:document.getElementById('popScope').value,text});pop.classList.remove('open');document.getElementById('commentSummary').textContent=comments.length+' comment'+(comments.length>1?'s':'')+' captured.';toast('Comment saved')};
function changed(){const out=[];if(state.paper!==defaults.paper)out.push(['--bg / --bg-secondary',state.paper]);if(state.accent!==defaults.accent)out.push(['--accent-orange',state.accent]);if(state.display!==defaults.display)out.push(['display scale',state.display+'×']);if(state.gutter!==defaults.gutter)out.push(['--page-padding',state.gutter+'vw']);if(state.density!==defaults.density)out.push(['journey density',state.density]);if(state.motion!==defaults.motion)out.push(['motion preview',String(state.motion)]);return out}
function exportMarkdown(){const lines=['## Frontend design round-trip','Source: '+META.source,'Captured at: '+new Date().toISOString().slice(0,19).replace('T',' ')+' (local)','Skill: frontend-design','Topic: '+META.topic,''];const decisions=changed();if(!decisions.length&&!edits.size&&!comments.length)return null;if(decisions.length){lines.push('### Decisions','');decisions.forEach(d=>lines.push('- `'+d[0]+'` → `'+d[1]+'`'));lines.push('')}if(edits.size){lines.push('### Direct edits','');[...edits].forEach(([id,value],i)=>lines.push('#### Edit '+(i+1),'- Element: `[data-fd-id="'+id+'"]` ('+id+')','- Kind: text','- Value: '+value,''))}if(comments.length){lines.push('### Element comments','');comments.forEach((c,i)=>lines.push('#### Comment '+(i+1),'- Element: `[data-fd-id="'+c.id+'"]` ('+c.id+')','- Scope: '+c.scope,'- Note: '+c.text,''))}lines.push('### Apply','','When applying these changes:','','1. **Token decisions** — write color and spacing decisions into `'+META.target+'` under `:root`; update the existing clamp formulas for display scale or story density. Keep components consuming shared variables.','','2. **Direct edits** — locate the matching `data-fd-id` concept in `src/components/` or `src/data/siteContent.ts` and update the source value.','','3. **Element comments** — apply each note at its selected scope.','','4. **Verify** — run `npm run build`, check 1440 / 1024 / 768 / 390 widths, and confirm reduced-motion behavior.');return lines.join('\n')}
function copy(text){navigator.clipboard?.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>toast('Open modal and copy manually'))}document.getElementById('exportBtn').onclick=()=>{const md=exportMarkdown();if(!md)return toast('Change a control, edit text, or add a comment first');document.getElementById('exportText').textContent=md;document.getElementById('modal').classList.add('open');copy(md)};document.getElementById('copyBtn').onclick=()=>copy(document.getElementById('exportText').textContent);document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('resetBtn').onclick=()=>{state={...defaults};comments=[];edits.clear();document.getElementById('displayScale').value='1';document.getElementById('gutter').value='6';document.getElementById('commentSummary').textContent='No comments yet.';document.body.classList.remove('comment-mode');const commentButton=document.getElementById('commentBtn');commentButton.classList.remove('on');commentButton.textContent='Comment mode';render();toast('Reset')};function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}render();
</script>
</body>
</html>
